<!DOCTYPE html>
<html>
    <head> 
        <title>JavaScript 3</title>
    </head>
    <body> 
        <h2>JavaScript 3</h2>
        <input type="text" id="numero1" placeholder="primer número">
        <input type="text" id="numero2" placeholder="segundo número">

        <button type="button" onclick="mostramayor()">Mostrar mayor</button>

        <script> 
        
            function mostramayor() {
                let num1 = Number(document.getElementById("numero1").value);
                let num2 = Number(document.getElementById("numero2").value);

                if (isNaN(num1) || isNaN(num2)) {
                    alert("Por favor, ingrese números válidos.");
                    return;
                }

                if (num1 > num2) {
                    alert("El número mayor es: " + num1);
                } else if (num2 > num1) {
                    alert("El número mayor es: " + num2);
                } else {
                    alert("Ambos números son iguales.");
                }
            }
        </script>
    </body>
</html>
